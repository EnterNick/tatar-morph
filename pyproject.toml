[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "tatar-morph"
dynamic = ["version"]
description = "Морфологический анализатор и генератор для татарского языка"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "hfst>=3.16.0.1",
]
keywords = [
    "tatar",
    "morphology",
    "nlp",
    "hfst",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Tatar",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/EnterNick/tatar-morph"
Repository = "https://github.com/EnterNick/tatar-morph"
Issues = "https://github.com/EnterNick/tatar-morph/issues"
Releases = "https://github.com/EnterNick/tatar-morph/releases"

[tool.setuptools.packages.find]
include = ["tatar_morph*"]

[tool.setuptools_scm]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=8.4.2",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "manage.py",
    "migrations",
    "__init__.py",
    "staticfiles",
    "apps.py",
    "versions",
]

line-length = 92

target-version = "py312"

[tool.ruff.lint]

select = [
    "E",
    "F",
    "W",
    "B",
    "A",
    "C",
    "N",
    "S",
    "T",
    "SIM",
    "PL",
    "PLE",
    "PLR",
    "PLW",
    "UP",
    "ERA",
    "ASYNC",
    "FBT",
    "INP",
    "TD",
    "COM",
    "PTH",
    "RUF",
    "PGH",
    "PD",
    "NPY",
    "TRY",
    "DTZ",
    "LOG",
    "G",
    "YTT",
    "FAST",
    "SLOT"
]
ignore = ["COM812", "S603", "PLR2004", "S101", "N805", "N818", "TRY003"]

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

flake8-annotations = { allow-star-arg-any = false }
flake8-type-checking = { strict = true }

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["RUF001"]

[tool.ruff.format]

quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
lines-after-imports = 2
order-by-type = true
split-on-trailing-comma = false

[tool.mypy]
pretty = true
strict_optional = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "py_expression_eval.*",
    "botocore.*",
]
ignore_missing_imports = true
