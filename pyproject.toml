[project]
name = "tatar-morph"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "hfst>=3.16.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]


[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "manage.py",
    "migrations",
    "__init__.py",
    "staticfiles",
    "apps.py",
    "versions",
]

line-length = 92

target-version = "py312"

[tool.ruff.lint]

select = [
    "E",
    "F",
    "W",
    "B",
    "A",
    "C",
    "N",
    "S",
    "T",
    "SIM",
    "PL",
    "PLE",
    "PLR",
    "PLW",
    "UP",
    "ERA",
    "ASYNC",
    "FBT",
    "INP",
    "TD",
    "COM",
    "PTH",
    "RUF",
    "PGH",
    "PD",
    "NPY",
    "TRY",
    "DTZ",
    "LOG",
    "G",
    "YTT",
    "FAST",
    "SLOT"
]
ignore = ["COM812", "S603", "PLR2004", "S101", "N805", "N818", "TRY003"]

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

flake8-annotations = { allow-star-arg-any = false }
flake8-type-checking = { strict = true }

[tool.ruff.format]

quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
lines-after-imports = 2
order-by-type = true
split-on-trailing-comma = false
